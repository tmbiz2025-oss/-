<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1724">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="競馬メモ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<title>たかくん競馬メモ</title>
<style>
:root{--bg:#08121d;--p:#102033;--p2:#15283c;--ln:#294159;--tx:#edf6fb;--mu:#93acbd;--mi:#70e3bd;--am:#f6c86f;--rd:#ff8f96}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#15334a 0,#08121d 220px);background-attachment:fixed;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;padding-bottom:90px}button,input,select,textarea{font:inherit;font-size:16px}.wrap{max-width:850px;margin:auto;padding:16px 12px}.top h1{margin:4px 0;font-size:28px}.top p{margin:0 0 14px;color:var(--mu);font-size:12px}.card{background:#102033;border:1px solid var(--ln);border-radius:16px;padding:13px;margin-bottom:11px}.day{display:grid;grid-template-columns:1.3fr 1fr .7fr;gap:8px}.f{display:grid;gap:4px}.f label{font-size:11px;color:var(--mu);font-weight:700}.f input,.f select,.f textarea{width:100%;background:#172a3e;color:var(--tx);border:1px solid #34516b;border-radius:10px;padding:9px 10px}.f textarea{min-height:58px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid #385671;background:#14283a;color:var(--tx);font-weight:800;border-radius:10px;padding:10px 12px}.pri{background:var(--mi);border-color:var(--mi);color:#092820}.warn{background:#4b3820;border-color:#6b522f;color:#ffe1a2}.danger{background:#44252c;border-color:#71414a;color:#ffc5c9}.alarm{border-width:2px}.alarm.green{border-color:#2f8069}.alarm.yellow{border-color:#9d7432}.alarm.orange{border-color:#b66a37}.alarm.red{border-color:#b84e5c}.alarm h2{margin:0 0 8px;font-size:19px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;margin-bottom:8px;background:#263c4f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.sig{background:#0b1928;border:1px solid #2e455b;border-radius:10px;padding:8px}.sig b{font-size:11px;display:flex;justify-content:space-between}.sig small{display:block;color:var(--mu);margin-top:3px}.on{color:var(--rd)}.off{color:var(--mi)}.race h3{margin:0 0 9px}.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.hint{font-size:10px;color:var(--mu)}.memo textarea{width:100%;min-height:360px;background:#071420;color:#fff;border:1px solid #34516b;border-radius:10px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}.stat{background:#0f1e2f;border:1px solid var(--ln);border-radius:11px;padding:9px}.stat span{display:block;color:var(--mu);font-size:10px}.stat strong{font-size:17px}.sticky{position:fixed;left:0;right:0;bottom:0;background:#091521ef;border-top:1px solid var(--ln);padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.stickyin{max-width:850px;margin:auto;display:flex;gap:7px}.sticky .btn{flex:1}.last4{margin-top:9px;color:#cbd9e3;font-size:11px;line-height:1.6}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#c5ffe8;color:#10372d;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:900;display:none}
@media(max-width:620px){.day{grid-template-columns:1fr 1fr}.day .f:first-child{grid-column:1/-1}.rgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px 10px}.sticky .btn{font-size:12px;padding:10px 6px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div style="font-size:10px;color:#70e3bd;font-weight:900;letter-spacing:.14em">PRIVATE NANKAN NOTE</div><h1>たかくん競馬メモ 🐴</h1><p>1日1ページ・12R固定。結果入力後に「警報チェック」で直近4予想Rを自動判定。</p></header>
<section class="card day">
<div class="f"><label>開催日</label><input id="date" type="date"></div>
<div class="f"><label>競馬場</label><select id="venue"><option>浦和</option><option>船橋</option><option>大井</option><option>川崎</option></select></div>
<div class="f"><label>第何日</label><select id="dayNum"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
</section>
<div class="actions"><button class="btn" id="prev">前の日</button><button class="btn pri" id="newDay">新しい日</button><button class="btn" id="next">次の日</button><button class="btn danger" id="del">この日を削除</button></div>
<section id="alarm" class="card alarm"></section>
<div id="stats" class="stats"></div>
<div id="races"></div>
<section class="card memo"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>いつものメモ形式</b><div class="hint">iPhoneメモやExcel転記用</div></div><button class="btn pri" id="copy">全文コピー</button></div><textarea id="memo" readonly></textarea></section>
</div>
<div class="sticky"><div class="stickyin"><button class="btn pri" id="check">警報チェック</button><button class="btn" id="jump">次の未入力Rへ</button><button class="btn" id="copy2">メモをコピー</button></div></div>
<div id="toast" class="toast"></div>
<script>
(function(){
var KEY='taka-keiba-memo-pwa-v1';
function q(id){return document.getElementById(id)}
function blankRace(n){return {n:n,meta:'',picks:'',ticket:'',bet:'',amount:'',result:'',refund:''}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fresh(){var d={id:'d'+Date.now(),date:today(),venue:'浦和',dayNum:1,races:[]};for(var i=1;i<=12;i++)d.races.push(blankRace(i));return {activeId:d.id,days:[d]}}
var data;
try{data=JSON.parse(localStorage.getItem(KEY)||'null')||fresh()}catch(e){data=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function active(){return data.days.find(function(x){return x.id===data.activeId})||data.days[0]}
function nums(s){return String(s||'').match(/\d+/g)?.map(Number)||[]}
function parsePicks(s){var left=String(s||'').split('(')[0];return nums(left)}
function parseResult(s){var str=String(s||'');var top=nums(str.split('(')[0]).slice(0,3);var pop=[];var m=str.match(/\(([^)]*)\)/);if(m)pop=nums(m[1]).slice(0,3);return {top:top,pop:pop}}
function stake(s){var n=nums(s);return n.length>=2?n[0]*n[1]:0}
function evalRace(day,r){var pred=parsePicks(r.picks),res=parseResult(r.result),eligible=pred.length>0&&res.top.length===3;var captured=eligible&&res.top.every(function(h){return pred.includes(h)});var firstIn=eligible&&res.top.includes(pred[0]);var big=eligible&&res.pop.some(function(p){return p>=8});var mid=eligible&&res.pop.some(function(p){return p>=6});return {day:day,r:r,eligible:eligible,captured:captured,firstIn:firstIn,big:big,mid:mid,stake:stake(r.amount),refund:Number(String(r.refund||'').replace(/\D/g,''))||0}}
function orderedDays(){return data.days.slice().sort(function(a,b){return a.date.localeCompare(b.date)||a.dayNum-b.dayNum})}
function timeline(){var out=[];orderedDays().forEach(function(d){d.races.forEach(function(r){var e=evalRace(d,r);if(e.eligible)out.push(e)})});return out}
function signals(){var rows=timeline().slice(-4);var s={ready:rows.length===4,rows:rows,first:0,capture:0,big:0,mid:0,a:false,b:false,c:false,m:false};rows.forEach(function(x){if(x.firstIn)s.first++;if(x.captured)s.capture++;if(x.big)s.big++;if(x.mid)s.mid++});if(s.ready){s.a=s.first<=1;s.b=s.capture===0;s.c=s.big>=2;s.m=s.mid>=3}return s}
function sev(s){if(!s.ready)return {c:'',t:'判定待ち',n:'直近4予想Rの結果がそろうと判定。'};if(s.b&&s.c)return {c:'red',t:'見送り推奨',n:'②＋③同時ON。最優先で警戒。'};var count=[s.a,s.b,s.c].filter(Boolean).length;if(count>=2)return {c:'orange',t:'強め注意',n:'警報2項目以上ON。基本は見送り寄り。'};if(s.b||s.c||s.m)return {c:'yellow',t:'注意',n:'単独警報。相手の閉じ方を再確認。'};return {c:'green',t:'通常',n:'直近4Rでは強い警報なし。'}}
function sig(name,on,txt){var st=on===null?'—':on?'ON':'OFF';return '<div class="sig"><b>'+name+'<span class="'+(on?'on':'off')+'">'+st+'</span></b><small>'+txt+'</small></div>'}
function alarm(){var s=signals(),v=sev(s);q('alarm').className='card alarm '+v.c;q('alarm').innerHTML='<h2>現在の警報</h2><span class="pill">'+v.t+'</span><div class="grid">'+sig('① 印1不振',s.ready?s.a:null,s.ready?s.first+'/4 馬券内（ON:1以下）':'4R未満')+sig('② 完全捕捉なし',s.ready?s.b:null,s.ready?s.capture+'/4 完全捕捉（ON:0）':'4R未満')+sig('③ 大穴侵入',s.ready?s.c:null,s.ready?s.big+'/4 で8人気以下（ON:2以上）':'4R未満')+sig('中穴注意',s.ready?s.m:null,s.ready?s.mid+'/4 で6人気以下（ON:3以上）':'4R未満')+'</div><div class="last4"><b>'+v.n+'</b><br>①は参考寄り。②＋③同時ONを最優先。印なし見送りRは除外。<br>'+s.rows.map(function(x){return x.day.date+' '+x.day.venue+x.r.n+'R'}).join(' / ')+'</div>'}
function raceCard(r){return '<section class="card race" data-r="'+r.n+'" id="r'+r.n+'"><h3>【'+r.n+'R】</h3><div class="rgrid">'+field('レース条件','meta',r.meta,'例：1400m・良・11頭・C2',true)+field('印と人気','picks',r.picks,'例：10,1,7,8,2(1,2,3,4,5)',true)+field('券種と買い方','ticket',r.ticket,'例：3連複軸流し / 見送り情報不足')+field('買い目','bet',r.bet,'例：10-(1,7,8,2)')+field('額','amount',r.amount,'例：6×200円',true)+field('結果','result',r.result,'例：7-10-6(3,1,7)',true)+field('払戻金','refund',r.refund,'例：2490',true)+'</div></section>'}
function field(label,k,val,ph,wide){return '<div class="f '+(wide?'wide':'')+'"><label>'+label+'</label><input data-k="'+k+'" value="'+String(val||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" placeholder="'+ph+'"></div>'}
function memoText(d){var p=d.date.split('-').map(Number);var s=p[0]+'/'+p[1]+'/'+p[2]+d.venue+'第'+d.dayNum+'日\n\n\n\n';d.races.forEach(function(r){s+='【'+r.n+'R】'+(r.meta||'')+'\n\n'+(r.picks||'')+'\n\n'+(r.ticket||'')+'\n'+(r.bet||'')+((r.ticket||r.bet)?'\n':'')+(r.amount||'')+'\n\n結果'+(r.result||'')+'\n払戻金'+(r.refund||'0')+'円\n\n'});return s.trimEnd()+'\n'}
function stats(){var ev=active().races.map(function(r){return evalRace(active(),r)});var st=ev.reduce(function(a,x){return a+x.stake},0),re=ev.reduce(function(a,x){return a+x.refund},0),done=ev.filter(function(x){return x.r.result}).length;q('stats').innerHTML='<div class="stat"><span>結果入力</span><strong>'+done+'/12R</strong></div><div class="stat"><span>投資→払戻</span><strong>'+st.toLocaleString()+'→'+re.toLocaleString()+'</strong></div><div class="stat"><span>当日ROI</span><strong>'+(st?(re/st*100).toFixed(1)+'%':'—')+'</strong></div>'}
function bind(){document.querySelectorAll('[data-r]').forEach(function(sec){var n=Number(sec.dataset.r);sec.querySelectorAll('[data-k]').forEach(function(inp){inp.addEventListener('input',function(){active().races[n-1][inp.dataset.k]=inp.value;save();q('memo').value=memoText(active());stats();alarm()})})})}
function render(){var d=active();q('date').value=d.date;q('venue').value=d.venue;q('dayNum').value=d.dayNum;q('races').innerHTML=d.races.map(raceCard).join('');q('memo').value=memoText(d);bind();alarm();stats()}
function toast(t){q('toast').textContent=t;q('toast').style.display='block';setTimeout(function(){q('toast').style.display='none'},1500)}
q('date').onchange=function(){active().date=this.value;save();render()};q('venue').onchange=function(){active().venue=this.value;save();render()};q('dayNum').onchange=function(){active().dayNum=Number(this.value);save();render()};
q('newDay').onclick=function(){var cur=active(),dt=new Date(cur.date+'T12:00:00');dt.setDate(dt.getDate()+1);var n={id:'d'+Date.now(),date:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),venue:cur.venue,dayNum:Math.min(cur.dayNum+1,6),races:[]};for(var i=1;i<=12;i++)n.races.push(blankRace(i));data.days.push(n);data.activeId=n.id;save();render();scrollTo(0,0)};
function go(x){var a=orderedDays(),i=a.findIndex(function(d){return d.id===data.activeId}),n=a[i+x];if(n){data.activeId=n.id;save();render();scrollTo(0,0)}else toast('その開催日はまだないよ')}
q('prev').onclick=function(){go(-1)};q('next').onclick=function(){go(1)};
q('del').onclick=function(){if(data.days.length===1)return toast('最後の1日は削除できないよ');if(confirm('この開催日を削除する？')){data.days=data.days.filter(function(x){return x.id!==data.activeId});data.activeId=orderedDays()[orderedDays().length-1].id;save();render()}};
async function copy(){var t=memoText(active());try{await navigator.clipboard.writeText(t);toast('コピーしたよ')}catch(e){q('memo').select();document.execCommand('copy');toast('コピーしたよ')}}
q('copy').onclick=copy;q('copy2').onclick=copy;
q('check').onclick=function(){alarm();q('alarm').scrollIntoView({behavior:'smooth',block:'center'});toast('直近4予想Rを更新したよ')};
q('jump').onclick=function(){var r=active().races.find(function(x){return !String(x.result).trim()});q('r'+(r?r.n:12)).scrollIntoView({behavior:'smooth'})};
render();
if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
</script>
</body>
</html>
